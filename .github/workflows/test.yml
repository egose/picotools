name: Test

on:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    paths-ignore:
    - '**.md'

jobs:
  unit-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Run unit tests
      run: |
        npm run test:git-commit
        bats tests/*.bats

  install-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Validate Bash Scripts
      run: |
        npm run check:syntax

    - name: Run Shellcheck
      run: |
        npm run check:shellcheck

    - name: Check Formatting
      run: |
        npm run check:format

    - name: Smoke Test Install Layout
      run: |
        set -euo pipefail

        chmod +x bin/* tools/bin/*
        mkdir -p dist tmp/download tmp/install
        tar -czf dist/picotools-test.tar.gz -C . VERSION lib -C tools bin lib
        cp dist/picotools-test.tar.gz tmp/download/

        ASDF_INSTALL_TYPE=version \
        ASDF_INSTALL_VERSION=test \
        ASDF_INSTALL_PATH="$PWD/tmp/install" \
        ASDF_DOWNLOAD_PATH="$PWD/tmp/download" \
          bin/install

        test -f "$PWD/tmp/install/VERSION"
        test "$(cat "$PWD/tmp/install/VERSION")" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/asdf-install" --help >/dev/null
        test "$("$PWD/tmp/install/bin/asdf-install" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/asdf-cli-install" --help >/dev/null
        test "$("$PWD/tmp/install/bin/asdf-cli-install" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/asdf-clean-unused" --help >/dev/null
        test "$("$PWD/tmp/install/bin/asdf-clean-unused" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/asdf-upgrade" --help >/dev/null
        test "$("$PWD/tmp/install/bin/asdf-upgrade" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/pip-upgrade" --help >/dev/null
        test "$("$PWD/tmp/install/bin/pip-upgrade" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/npm-publish-package" --help >/dev/null
        test "$("$PWD/tmp/install/bin/npm-publish-package" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/gh-repo-sync" --help >/dev/null
        test "$("$PWD/tmp/install/bin/gh-repo-sync" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/gh-actions-upgrade" --help >/dev/null
        test "$("$PWD/tmp/install/bin/gh-actions-upgrade" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/gh-release-assets" --help >/dev/null
        test "$("$PWD/tmp/install/bin/gh-release-assets" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/git-profile" --help >/dev/null
        test "$("$PWD/tmp/install/bin/git-profile" --version)" = "$(cat VERSION)"
        git_profile_home="$PWD/tmp/git-profile-home"
        mkdir -p "$git_profile_home/.config" "$git_profile_home/.local/share"
        HOME="$git_profile_home" \
        XDG_CONFIG_HOME="$git_profile_home/.config" \
        XDG_DATA_HOME="$git_profile_home/.local/share" \
          "$PWD/tmp/install/bin/git-profile" list | grep -F 'No git profiles found.' >/dev/null
        printf 'installed\nInstalled User\ninstalled@example.com\nno\nno\n\n' | \
          HOME="$git_profile_home" \
          XDG_CONFIG_HOME="$git_profile_home/.config" \
          XDG_DATA_HOME="$git_profile_home/.local/share" \
            "$PWD/tmp/install/bin/git-profile" create >/dev/null
        printf '1\n' | \
          HOME="$git_profile_home" \
          XDG_CONFIG_HOME="$git_profile_home/.config" \
          XDG_DATA_HOME="$git_profile_home/.local/share" \
            "$PWD/tmp/install/bin/git-profile" read | grep -F 'Installed User' >/dev/null

        "$PWD/tmp/install/bin/pre-commit-upgrade" --help >/dev/null
        test "$("$PWD/tmp/install/bin/pre-commit-upgrade" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/model-profile" --help >/dev/null
        test "$("$PWD/tmp/install/bin/model-profile" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/git-api" --help >/dev/null
        test "$("$PWD/tmp/install/bin/git-api" --version)" = "$(cat VERSION)"
        test -f "$PWD/tmp/install/lib/picotools/git-api/operation-id-index.json"
        test -f "$PWD/tmp/install/lib/picotools/git-api/github-rest-path-tree/repos/{owner}/{repo}/get.json"

        "$PWD/tmp/install/bin/git-commit" --help >/dev/null
        test "$("$PWD/tmp/install/bin/git-commit" --version)" = "$(cat VERSION)"
        for module in \
          git_commit_config.sh \
          git_commit_execution.sh \
          git_commit_hooks.sh \
          git_commit_model.sh \
          git_commit_options.sh \
          git_commit_plan.sh \
          git_commit_prompt.sh \
          git_commit_remote.sh \
          git_commit_scope.sh \
          git_commit_workspace.sh; do
          test -f "$PWD/tmp/install/lib/picotools/$module"
        done

        git_commit_home="$PWD/tmp/git-commit-home"
        git_commit_repo="$PWD/tmp/git-commit-repo"
        git_commit_installed_bin="$PWD/tmp/install/bin/git-commit"
        mkdir -p "$git_commit_home/.config/git-commit" "$git_commit_home/.local/share" "$git_commit_home/bin"
        real_jq=$(asdf which jq 2>/dev/null || command -v jq)
        ln -s "$real_jq" "$git_commit_home/bin/jq"
        cat >"$git_commit_home/bin/model-profile" <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        case "${1:-}" in
        ask)
          printf '%s\n' '{"commits":[{"type":"feat","message":"update file","files":["file.txt"]}]}'
          ;;
        *)
          exit 1
          ;;
        esac
        EOF
        chmod +x "$git_commit_home/bin/model-profile"
        printf '[model]\n\tprofile = stub\n\tname = stub-model\n' >"$git_commit_home/.config/git-commit/config"
        git init "$git_commit_repo" >/dev/null
        git -C "$git_commit_repo" config user.name 'CI User'
        git -C "$git_commit_repo" config user.email 'ci@example.com'
        printf '%s\n' base >"$git_commit_repo/file.txt"
        git -C "$git_commit_repo" add file.txt
        git -C "$git_commit_repo" commit -m 'chore: initial commit' >/dev/null
        printf '%s\n' change >"$git_commit_repo/file.txt"
        preview_output=$(cd "$git_commit_repo" && \
          HOME="$git_commit_home" \
          XDG_CONFIG_HOME="$git_commit_home/.config" \
          XDG_DATA_HOME="$git_commit_home/.local/share" \
          MODEL_PROFILE_BIN="$git_commit_home/bin/model-profile" \
          PATH="$git_commit_home/bin:$PATH" \
            "$git_commit_installed_bin" --no-scope)
        printf '%s\n' "$preview_output" | grep -F 'git add -A --' >/dev/null
        printf '%s\n' "$preview_output" | grep -F 'git commit -m' >/dev/null
        test -z "$(git -C "$git_commit_repo" status --short --untracked-files=no | grep '^M  ' || true)"
        test "$(git -C "$git_commit_repo" rev-list --count HEAD)" = '1'

        "$PWD/tmp/install/bin/git-release-setup" --help >/dev/null
        test "$("$PWD/tmp/install/bin/git-release-setup" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/git-clean-branches" --help >/dev/null
        test "$("$PWD/tmp/install/bin/git-clean-branches" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/git-clean-task-pr" --help >/dev/null
        test "$("$PWD/tmp/install/bin/git-clean-task-pr" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/license" --help >/dev/null
        test "$("$PWD/tmp/install/bin/license" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/inotify-watches" --help >/dev/null
        test "$("$PWD/tmp/install/bin/inotify-watches" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/oc-quota-requests" --help >/dev/null
        test "$("$PWD/tmp/install/bin/oc-quota-requests" --version)" = "$(cat VERSION)"

        "$PWD/tmp/install/bin/oc-route" --help >/dev/null
        test "$("$PWD/tmp/install/bin/oc-route" --version)" = "$(cat VERSION)"

    - name: Functional Test pip-upgrade scopes
      run: bash scripts/functional-test-pip-upgrade-scopes.bash

    - name: Functional Test git-clean-task-pr no editor
      run: bash scripts/functional-test-git-clean-task-pr-no-editor.bash

    - name: Functional Test git-clean-task-pr refreshes remote head
      run: bash scripts/functional-test-git-clean-task-pr-refreshes-remote-head.bash

    - name: Functional Test git-clean-task-pr falls back to main
      run: bash scripts/functional-test-git-clean-task-pr-falls-back-to-main.bash
